name: Local Build Docker Image

on:
    push:
        branches:
            - main

    pull_request: null

jobs:
    local_build_docker_image:
        runs-on: ubuntu-latest
        steps:
            -   name: Check out the repo
                uses: actions/checkout@v2

            -   name: Build image
                run: docker build . -t splitter

            -   name: Test Docker image fails without configuration
                run: |
                    if docker run splitter; then
                        echo "Expected the splitter to fail without configuration."
                        exit 1
                    fi
